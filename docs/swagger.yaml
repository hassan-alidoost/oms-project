basePath: /
definitions:
  domain.Order:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        format: int64
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      status:
        $ref: '#/definitions/domain.OrderStatus'
      totalPrice:
        format: int64
        type: integer
      updatedAt:
        type: string
    type: object
  domain.OrderItem:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        format: int64
        type: integer
      price:
        format: int64
        type: integer
      product:
        $ref: '#/definitions/domain.Product'
      productID:
        format: int64
        type: integer
      quantity:
        format: int32
        type: integer
      updatedAt:
        type: string
    type: object
  domain.OrderStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - Pending
    - Paid
    - Shipped
    - Cancelled
  domain.Product:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        format: int64
        type: integer
      name:
        type: string
      price:
        format: int64
        type: integer
      stock:
        format: int32
        type: integer
      updatedAt:
        type: string
    type: object
  order.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/order.OrderItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  order.OrderItemRequest:
    properties:
      price:
        type: integer
      product_id:
        type: integer
      quantity:
        type: integer
    required:
    - price
    - product_id
    - quantity
    type: object
host: localhost:8080
info:
  contact: {}
  description: Order Management System with Hexagonal Architecture.
  title: OMS API
  version: "1.0"
paths:
  /orders:
    post:
      consumes:
      - application/json
      description: Creates an order with a random customer ID and specific price
      parameters:
      - description: Order Details
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Invalid request
          schema:
            type: string
      summary: Create a new order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Returns a single order by its uint64 ID
      parameters:
      - description: Order ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "404":
          description: Order not found
          schema:
            type: string
      summary: Get an order
      tags:
      - orders
swagger: "2.0"
