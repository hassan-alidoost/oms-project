basePath: /
definitions:
  entities.Order:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        format: int64
        type: integer
      items:
        items:
          $ref: '#/definitions/entities.OrderItem'
        type: array
      status:
        $ref: '#/definitions/entities.OrderStatus'
      totalPrice:
        format: int64
        type: integer
      updatedAt:
        type: string
      userID:
        format: int64
        type: integer
    type: object
  entities.OrderItem:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        format: int64
        type: integer
      price:
        format: int64
        type: integer
      quantity:
        format: int32
        type: integer
      updatedAt:
        type: string
    type: object
  entities.OrderStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - Pending
    - Paid
    - Shipped
    - Cancelled
  order.CreateOrderRequest:
    properties:
      customer_id:
        type: integer
      price:
        type: integer
    required:
    - customer_id
    - price
    type: object
host: localhost:8080
info:
  contact: {}
  description: Order Management System with Hexagonal Architecture.
  title: OMS API
  version: "1.0"
paths:
  /orders:
    post:
      consumes:
      - application/json
      description: Creates an order with a random customer ID and specific price
      parameters:
      - description: Order Details
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entities.Order'
        "400":
          description: Invalid request
          schema:
            type: string
      summary: Create a new order
      tags:
      - orders
  /orders/{id}:
    get:
      description: Returns a single order by its uint64 ID
      parameters:
      - description: Order ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.Order'
        "404":
          description: Order not found
          schema:
            type: string
      summary: Get an order
      tags:
      - orders
swagger: "2.0"
