version: '3.8'

services:
  oms_postgres:
    image: postgres
    container_name: oms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - oms_api
    restart: unless-stopped





volumes:
  postgres:


networks:
  oms_api:
    driver: bridge